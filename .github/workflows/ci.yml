name: CI

# Runs on every push/PR. This is what makes "tests pass" a checked fact
# instead of a claim in a markdown file — BETA_DEVELOPMENT_STATUS.md and
# PRODUCTION_AUDIT.md both note that the sandbox this project was built in
# could not run pytest (no Postgres driver reachable) or `npm ci` (no
# registry access). Neither limitation applies to GitHub Actions.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: respectful_meet
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: respectful_meet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U respectful_meet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alembic migrations against the test database
        env:
          DATABASE_URL: postgresql+psycopg2://respectful_meet:devpassword@localhost:5432/respectful_meet_test
        run: alembic upgrade head

      - name: Run pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://respectful_meet:devpassword@localhost:5432/respectful_meet_test
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

